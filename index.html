<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Sc. V-B Bravo Timetable</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 1.2rem;
            color: #1a365d;
            text-align: center;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.5rem;
            color: #2b6cb0;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .slot-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #4a5568;
            width: 70px;
        }
        .slot-content {
            flex-grow: 1;
            text-align: right;
            font-weight: 600;
            font-size: 1rem;
        }
        /* Custom Tag Styling based on your rules */
        .badge-green {
            background-color: #c6f6d5;
            color: #22543d;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .badge-red {
            background-color: #fed7d7;
            color: #742a2a;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .badge-tuto {
            background-color: #e6fffa;
            color: #234e52;
            border: 2px solid #319795;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .badge-default {
            background-color: #edf2f7;
            color: #2d3748;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>B.Sc. V-B (BRAVO)</h1>
    <h2 id="today-header">Loading...</h2>
    <div id="schedule-container"></div>
    <div class="footer-note">TS Chanakya Naval Academy Timetable</div>
</div>

<script>
    // Complete verified timetable data for B.Sc. V-B
    const timetableData = {
        "Monday": [
            { slot: "1st", text: "ME & AUTO — VJF", type: "green" },
            { slot: "2nd", text: "ERM & WS — ANK", type: "green" },
            { slot: "3rd", text: "NAV ARCH-I — ANK", type: "green" },
            { slot: "4th", text: "SHIP OPRTN — SN/RP", type: "default" },
            { slot: "5th", text: "SHIP ORPRTN — CPM", type: "green" },
            { slot: "6th", text: "NAV ARCH-I — CAK", type: "green" }
        ],
        "Tuesday": [
            { slot: "1st", text: "SM & PTNG — TUT/RP", type: "default" },
            { slot: "2nd", text: "IMO INT CON — CYS", type: "red" },
            { slot: "3rd", text: "WK PRCT-I — KBS/T", type: "green" },
            { slot: "4th", text: "SM & PTNG — CGJ", type: "red" },
            { slot: "5th", text: "ERM & WS — ANK", type: "green" },
            { slot: "6th", text: "ERM & WS — ANK", type: "green" }
        ],
        "Wednesday": [
            { slot: "1st", text: "ME & AUTO — VJF", type: "green" },
            { slot: "2nd", text: "SM & PTNG — CGJ/T", type: "red" },
            { slot: "3rd", text: "FP PLC ACT — CPM", type: "green" },
            { slot: "4th", text: "ME & AUTO — VJF", type: "green" },
            { slot: "5th", text: "SM & PTNG — CGJ", type: "red" },
            { slot: "6th", text: "WK PRCT-I — KBS/T", type: "green" }
        ],
        "Thursday": [
            { slot: "1st", text: "IMO INT CON — CYS", type: "red" },
            { slot: "2nd", text: "SHIP OPRTN — TUTO", type: "tuto" },
            { slot: "3rd", text: "SM & PTNG — CGJ", type: "red" },
            { slot: "4th", text: "ERM & WS — TUTO", type: "tuto" },
            { slot: "5th", text: "ME & AUTO — VJF", type: "green" },
            { slot: "6th", text: "NAV ARCH-I — CAK", type: "green" }
        ],
        "Friday": [
            { slot: "1st", text: "ERM & WS — ANK", type: "green" },
            { slot: "2nd", text: "ERM & WS — TUTO", type: "tuto" },
            { slot: "3rd", text: "SM & PTNG — CGJ", type: "red" },
            { slot: "4th", text: "WK PRCT-I — CDK", type: "default" },
            { slot: "5th", text: "WK PRCT-I — KBS/T", type: "green" },
            { slot: "6th", text: "IMO INT CON — CYS", type: "red" }
        ],
        "Saturday": [
            { slot: "1st", text: "ME & AUTO — VJF", type: "green" },
            { slot: "2nd", text: "SM & PTNG — RPS", type: "default" },
            { slot: "3rd", text: "SHIP OPRTN — SNY", type: "default" },
            { slot: "4th", text: "IMO INT CON — KBS", type: "green" },
            { slot: "5th", text: "NAV ARCH-I — CAK", type: "green" },
            { slot: "6th", text: "IMO INT CON — KBS", type: "green" }
        ],
        "Sunday": [
            { slot: "Holiday", text: "🎉 Sunday! No classes today.", type: "default" }
        ]
    };

    // Detect current day
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const todayName = days[new Date().getDay()];

    // Render header
    document.getElementById("today-header").innerText = todayName;

    // Render slots
    const container = document.getElementById("schedule-container");
    const schedule = timetableData[todayName];

    schedule.forEach(item => {
        let badgeClass = "badge-default";
        if (item.type === "green") badgeClass = "badge-green";
        if (item.type === "red") badgeClass = "badge-red";
        if (item.type === "tuto") badgeClass = "badge-tuto";

        const card = document.createElement("div");
        card.className = "slot-card";
        card.innerHTML = `
            <div class="slot-title">${item.slot}</div>
            <div class="slot-content"><span class="${badgeClass}">${item.text}</span></div>
        `;
        container.appendChild(card);
    });
</script>

</body>
</html>
